upstream web {
    server web:8000;
}

upstream camera_service {
    server camera_service:8001;
}

server {
    listen 80;

    client_max_body_size 100M;

    # Static files served directly from volume
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files served directly from volume
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Camera service — MJPEG streams and API
    # Matches /cameras/, /mobile-cameras/, /head-count/
    location ~ ^/(cameras|mobile-cameras|head-count)/ {
        proxy_pass http://camera_service;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # MJPEG streams need long timeouts and no buffering
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;

        # Disable response buffering for streaming
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # LiveKit WebSocket proxy
    location /livekit-proxy/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Django Channels WebSocket connections
    location /ws/ {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSockets need long timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Main Django app
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
