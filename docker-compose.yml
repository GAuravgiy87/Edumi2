services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=edumi
      - POSTGRES_USER=edumi
      - POSTGRES_PASSWORD=edumi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  livekit:
    image: livekit/livekit-server:v1.5.2
    command: --config /etc/livekit/config.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50100-50120:50100-50120/udp"  # RTC UDP range
    volumes:
      - ./livekit.yaml:/etc/livekit/config.yaml
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "
            python manage.py makemigrations &&
            python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 school_project.asgi:application"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-secret-key-12345}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DATABASE_URL=postgres://edumi:edumi@db:5432/edumi
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://10.7.11.141/livekit-proxy}
      - LIVEKIT_INTERNAL_URL=ws://livekit:7880
      - LIVEKIT_INTERNAL_HTTP_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret_must_be_32_characters_long_1234
      # Allow localhost, 127.0.0.1, and your network IP for CSRF
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://10.7.11.141,http://10.7.11.141:8000,http://10.7.11.141:8001}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: .
    restart: unless-stopped
    command: celery -A school_project worker -l info
    volumes:
      - media_data:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-secret-key-12345}
      - DATABASE_URL=postgres://edumi:edumi@db:5432/edumi
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  camera_service:
    build: 
      context: .
      dockerfile: camera_service/Dockerfile
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - .:/app
    working_dir: /app/camera_service
    ports:
      - "8001:8001"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://edumi:edumi@db:5432/edumi
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_data:/app/static
      - media_data:/app/media
    depends_on:
      - web
      - camera_service

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
