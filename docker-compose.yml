version: "3.9"

services:
  # -------------------------------------------------
  # PostgreSQL – persisted data on host volume
  # -------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: edumi_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: edumi_db
      POSTGRES_USER: edumi_user
      POSTGRES_PASSWORD: edumi_pass
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumi_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------
  # Redis – required for Channels & Celery
  # -------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: edumi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # -------------------------------------------------
  # LiveKit – media/SFU server
  # -------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: edumi_livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50200:50000-50200/udp"
    environment:
      LIVEKIT_PORT: "7880"

  # -------------------------------------------------
  # Django web containers – one per logical domain
  # -------------------------------------------------
  auth:
    build: .
    container_name: edumi_auth
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8002", "school_project.asgi:application"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8002:8002"

  admin:
    build: .
    container_name: edumi_admin
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8003", "school_project.asgi:application"]
    env_file: .env
    depends_on: [db, redis]

  meeting:
    build: .
    container_name: edumi_meeting
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8004", "school_project.asgi:application"]
    env_file: .env
    depends_on: [db, redis]

  camera:
    build: .
    container_name: edumi_camera
    restart: unless-stopped
    command: ["python", "camera_service/serve.py"]
    env_file: .env
    depends_on: [db, redis]

  msg:
    build: .
    container_name: edumi_msg
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8005", "school_project.asgi:application"]
    env_file: .env
    depends_on: [db, redis]

  profile:
    build: .
    container_name: edumi_profile
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8006", "school_project.asgi:application"]
    env_file: .env
    depends_on: [db, redis]

  video:
    build: .
    container_name: edumi_video
    restart: unless-stopped
    command: ["daphne", "-b", "0.0.0.0", "-p", "8007", "school_project.asgi:application"]
    env_file: .env
    depends_on: [db, redis]

  video_editing:
    build: .
    container_name: edumi_video_editing
    restart: unless-stopped
    command: ["python", "video_editing/manage_editing.py"]
    env_file: .env
    depends_on: [db, redis]

  live_stream:
    build: .
    container_name: edumi_live_stream
    restart: unless-stopped
    command: ["python", "live_stream/run_stream.py"]
    env_file: .env
    depends_on: [db, redis, livekit]

  # -------------------------------------------------
  # Celery worker – single instance (scale as needed)
  # -------------------------------------------------
  celery:
    build: .
    container_name: edumi_celery
    restart: unless-stopped
    command: ["celery", "-A", "school_project", "worker", "-l", "info", "-P", "threads"]
    env_file: .env
    depends_on: [db, redis]

  # -------------------------------------------------
  # Optional Nginx reverse‑proxy for HTTPS termination
  # -------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    container_name: edumi_nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/ssl/certs:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - auth
      - admin
      - meeting
      - camera
      - msg
      - profile
      - video
      - video_editing
      - live_stream
