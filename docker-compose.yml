version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=edumi
      - POSTGRES_USER=edumi
      - POSTGRES_PASSWORD=edumi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/config.yaml
    ports:
      - "7880:7880"   # HTTP/WS API
      - "7881:7881"   # RTC TCP
      - "50000-50200:50000-50200/udp"  # RTC UDP range
    volumes:
      - ./livekit.yaml:/etc/livekit/config.yaml
    restart: unless-stopped

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 school_project.asgi:application
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-secret-key-12345
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgres://edumi:edumi@db:5432/edumi
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=devsecret
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: .
    command: celery -A school_project worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-docker-secret-key-12345
      - DATABASE_URL=postgres://edumi:edumi@db:5432/edumi
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  camera_service:
    build: ./camera_service
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - ./camera_service:/app
    ports:
      - "8001:8001"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://edumi:edumi@db:5432/edumi
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/static
      - ./media:/app/media
    depends_on:
      - web
      - camera_service

volumes:
  postgres_data:
  redis_data:
