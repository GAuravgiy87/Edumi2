# EduMi2 - Full Stack Docker Compose
#
# Deploy:  DOCKER_BUILDKIT=1 docker compose --env-file .env.docker up -d --build
# Admin:   docker compose --env-file .env.docker exec web python manage.py createsuperuser
# All secrets and IPs live in .env.docker - edit that file only.

x-django-env: &django-env
  SECRET_KEY: "${SECRET_KEY}"
  DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
  LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
  LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
  FACE_ENCRYPTION_KEY: "${FACE_ENCRYPTION_KEY}"
  LIVEKIT_URL: "ws://${SERVER_IP}/livekit-proxy"
  CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1,http://${SERVER_IP}"
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  REDIS_URL: "redis://redis:6379/0"
  LIVEKIT_INTERNAL_URL: "ws://livekit:7880"
  LIVEKIT_INTERNAL_HTTP_URL: "http://livekit:7880"
  CAMERA_SERVICE_URL: "http://camera_service:8001"
  FACE_MATCH_THRESHOLD: "0.50"
  FACE_PRESENCE_DURATION: "30"

services:

  # 1. PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: edumi2_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edumi_net

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: edumi2_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edumi_net

  # 3. LiveKit SFU
  livekit:
    image: livekit/livekit-server:v1.5.2
    container_name: edumi2_livekit
    restart: unless-stopped
    command: --config /etc/livekit/config.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit/config.yaml:ro
    networks:
      - edumi_net

  # 4. Django Web App (entrypoint: migrate -> collectstatic -> daphne)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edumi2_web
    restart: unless-stopped
    environment:
      <<: *django-env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edumi_net

  # 5. Celery Worker (same Dockerfile as web — layers are cached, no extra build time)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edumi2_worker
    restart: unless-stopped
    command: celery -A school_project worker -l warning --concurrency=2
    environment:
      <<: *django-env
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edumi_net

  # 6. Camera Service (entrypoint: wait for db -> runserver)
  camera_service:
    build:
      context: .
      dockerfile: camera_service/Dockerfile
    container_name: edumi2_camera
    restart: unless-stopped
    environment:
      DEBUG: "False"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - edumi_net

  # 7. Nginx (single public entry point on port 80)
  nginx:
    image: nginx:alpine
    container_name: edumi2_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/static:ro
      - media_data:/app/media:ro
    depends_on:
      - web
      - camera_service
    networks:
      - edumi_net

volumes:
  postgres_data:
    name: edumi2_postgres
  redis_data:
    name: edumi2_redis
  static_data:
    name: edumi2_static
  media_data:
    name: edumi2_media

networks:
  edumi_net:
    name: edumi2_network
    driver: bridge
