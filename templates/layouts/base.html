<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>{% block title %}Edumi - Educational Management System{% endblock %}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/modern-design.css' %}?v={{ timestamp }}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v={{ timestamp }}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v={{ timestamp }}">
    <!-- Hotwired Turbo for seamless navigation (no full page reloads) -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.5/dist/turbo.es2017-esm.js"></script>
    <script>
        document.addEventListener('turbo:before-fetch-response', (event) => {
            // No action needed yet
        });
        
        document.addEventListener('turbo:frame-missing', (event) => {
            event.preventDefault();
            // Do a full page visit instead of ignoring the response
            event.detail.visit(event.detail.response.url, { action: 'replace' });
        });
    </script>
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% include 'components/navbar.html' %}

    {% block content %}{% endblock %}

    {% include 'partials/welcome_popup.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/eyes.js' %}"></script>
    <script src="{% static 'js/main.js' %}?v={{ timestamp }}"></script>
    <script>
        // Profile dropdown toggle
        function toggleProfileDropdown() {
            const dropdown = document.getElementById('profileDropdown');
            dropdown.classList.toggle('show');
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', function (e) {
            if (!e.target.closest('.nav-profile-dropdown')) {
                const dropdown = document.getElementById('profileDropdown');
                if (dropdown) {
                    dropdown.classList.remove('show');
                }
            }
        });
    </script>
    {% include 'components/lucide_icons.html' %}
    {% block extra_js %}{% endblock %}
</body>

</html>
