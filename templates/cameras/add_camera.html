<!-- ================= CAMERA MODAL ================= -->
<div id="cameraModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Add Camera</h2>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <form id="cameraForm" onsubmit="saveCamera(event)">
            {% csrf_token %}
            <input type="hidden" id="cameraId" name="camera_id">

            <div class="form-group">
                <label>Camera Name</label>
                <input type="text" id="camName" name="name" class="form-control" required>
            </div>

            <div class="form-group">
                <label>Camera Type</label>
                <select id="camType" name="camera_type" class="form-control" onchange="handleTypeChange()">
                    <option value="rtsp">RTSP Camera</option>
                    <option value="ip_webcam">IP Webcam</option>
                    <option value="droidcam">DroidCam</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>IP Address</label>
                    <input type="text" id="camIp" name="ip_address" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Port</label>
                    <input type="number" id="camPort" name="port" class="form-control" value="554">
                </div>
            </div>

            <div id="rtspAuth" class="grid-2">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="camUser" name="username" class="form-control">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="camPass" name="password" class="form-control">
                </div>
            </div>

            <div id="rtspPath" class="form-group">
                <label>Stream Path (Optional - auto-detects if empty)</label>
                <input type="text" id="camStreamPath" name="stream_path" class="form-control" placeholder="/stream or /live">
            </div>

            <button type="submit" class="btn-save">Save Camera</button>
        </form>
    </div>
</div>

<!-- ================= MODAL STYLES ================= -->
<style>
    .close-btn {
        border: none;
        background: none;
        font-size: 1.25rem;
        color: var(--text-muted);
        cursor: pointer;
        transition: color 0.2s;
    }

    .close-btn:hover {
        color: var(--text-main);
    }

    /* Grid */
    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    @media (max-width: 480px) {
        .grid-2 {
            grid-template-columns: 1fr;
        }
    }
</style>

<!-- ================= MODAL SCRIPT ================= -->
<script>
    function openAddModal() {
        document.getElementById('cameraForm').reset();
        document.getElementById('cameraId').value = '';
        document.getElementById('modalTitle').innerText = 'Add Camera';
        handleTypeChange();
        document.getElementById('cameraModal').classList.add('show');
        if (typeof disableScroll === 'function') disableScroll();
    }

    function closeModal() {
        document.getElementById('cameraModal').classList.remove('show');
        if (typeof enableScroll === 'function') enableScroll();
    }

    function handleTypeChange() {
        const type = document.getElementById('camType').value;
        const portInput = document.getElementById('camPort');
        const rtspAuth = document.getElementById('rtspAuth');
        const rtspPath = document.getElementById('rtspPath');

        if (type === 'rtsp') {
            rtspAuth.style.display = 'grid';
            rtspPath.style.display = 'block';
            portInput.value = 554;
        } else if (type === 'ip_webcam') {
            rtspAuth.style.display = 'none';
            rtspPath.style.display = 'none';
            portInput.value = 8080;
        } else {
            rtspAuth.style.display = 'none';
            rtspPath.style.display = 'none';
            portInput.value = 4747;
        }
    }

    async function openEditModal(id) {
        const res = await fetch(`/cameras/edit-camera/${id}/`);
        const data = await res.json();
        
        document.getElementById('modalTitle').innerText = 'Edit Camera';
        document.getElementById('cameraId').value = data.id;
        document.getElementById('camName').value = data.name;
        document.getElementById('camType').value = data.camera_type;
        document.getElementById('camIp').value = data.ip_address;
        document.getElementById('camPort').value = data.port;
        document.getElementById('camUser').value = data.username;
        document.getElementById('camPass').value = data.password;
        document.getElementById('camStreamPath').value = data.stream_path;
        
        handleTypeChange();
        document.getElementById('cameraModal').classList.add('show');
        if (typeof disableScroll === 'function') disableScroll();
    }

    async function saveCamera(e) {
        e.preventDefault();

        const cameraForm = document.getElementById('cameraForm');
        const formData = new FormData(cameraForm);
        const id = formData.get('camera_id');
        const url = id ? `/cameras/edit-camera/${id}/` : `/cameras/add-camera/`;

        const res = await fetch(url, {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': '{{ csrf_token }}' }
        });

        if (res.ok) window.location.reload();
    }
</script>
