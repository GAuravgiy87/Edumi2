# Render Blueprint for EduMi2
services:
  - type: web
    name: edumi2-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: edumi2-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edumi2-redis
          property: connectionString
      - key: LIVEKIT_URL
        sync: false # You'll set this in Render Dashboard
      - key: LIVEKIT_INTERNAL_URL
        sync: false # Same as LIVEKIT_URL
      - key: LIVEKIT_INTERNAL_HTTP_URL
        sync: false # HTTPS version of LIVEKIT_URL
      - key: LIVEKIT_API_KEY
        sync: false # From LiveKit Cloud
      - key: LIVEKIT_API_SECRET
        sync: false # From LiveKit Cloud
      - key: FACE_ENCRYPTION_KEY
        generateValue: true
      - key: FACE_MATCH_THRESHOLD
        value: 0.50
      - key: FACE_PRESENCE_DURATION
        value: 30
      - key: LOG_LEVEL
        value: WARNING
    healthCheckPath: /
    autoDeploy: true
    numInstances: 1

  - type: web
    name: edumi2-camera
    runtime: docker
    plan: free
    dockerfilePath: ./camera_service/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edumi2-db
          property: connectionString
      - key: DEBUG
        value: false
    autoDeploy: true
    dockerCommand: "python manage.py runserver 0.0.0.0:10000"
    numInstances: 1

  - type: redis
    name: edumi2-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections

databases:
  - name: edumi2-db
    databaseName: edumi2
    user: edumi2
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections
