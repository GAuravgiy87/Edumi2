# Render Blueprint for EduMi2
services:
  - type: web
    name: edumi2-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: edumi2-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edumi2-redis
          property: connectionString
      - key: LIVEKIT_URL
        value: "wss://{{ .Service.Name }}.onrender.com/livekit-proxy"
      - key: LIVEKIT_INTERNAL_URL
        fromService:
          name: edumi2-livekit
          type: web
          property: host
          port: 7880
          protocol: ws
      - key: LIVEKIT_INTERNAL_HTTP_URL
        fromService:
          name: edumi2-livekit
          type: web
          property: host
          port: 7880
          protocol: http
      - key: LIVEKIT_API_KEY
        value: devkey
      - key: LIVEKIT_API_SECRET
        generateValue: true
      - key: FACE_ENCRYPTION_KEY
        generateValue: true
      - key: FACE_MATCH_THRESHOLD
        value: 0.50
      - key: FACE_PRESENCE_DURATION
        value: 30
      - key: LOG_LEVEL
        value: WARNING
    healthCheckPath: /
    autoDeploy: true
    dockerCommand: "sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 10000 school_project.asgi:application'"
    numInstances: 1

  - type: worker
    name: edumi2-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SECRET_KEY
        fromService:
          type: web
          name: edumi2-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: edumi2-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edumi2-redis
          property: connectionString
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: WARNING
    dockerCommand: "celery -A school_project worker -l warning --concurrency=1"
    numInstances: 1

  - type: web
    name: edumi2-camera
    runtime: docker
    plan: free
    dockerfilePath: ./camera_service/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edumi2-db
          property: connectionString
      - key: DEBUG
        value: false
    autoDeploy: true
    dockerCommand: "python manage.py runserver 0.0.0.0:10000"
    numInstances: 1

  - type: web
    name: edumi2-livekit
    runtime: image
    plan: free
    image: livekit/livekit-server:v1.5.2
    autoDeploy: true
    dockerCommand: "--config /etc/livekit/config.yaml"
    envVars:
      - key: LIVEKIT_KEY
        fromService:
          type: web
          name: edumi2-web
          envVarKey: LIVEKIT_API_KEY
      - key: LIVEKIT_SECRET
        fromService:
          type: web
          name: edumi2-web
          envVarKey: LIVEKIT_API_SECRET
    numInstances: 1
    disk:
      name: livekit-config
      mountPath: /etc/livekit
      sizeGB: 0.25

  - type: redis
    name: edumi2-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections

databases:
  - name: edumi2-db
    databaseName: edumi2
    user: edumi2
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections
