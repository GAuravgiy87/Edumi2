# Render Blueprint for EduMi2 (Free Plan Compatible)
services:
  # Main Django Web Service
  - type: web
    name: edumi2-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: edumi2-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edumi2-redis
          property: connectionString
      - key: LIVEKIT_API_KEY
        value: devkey
      - key: LIVEKIT_API_SECRET
        generateValue: true
      - key: FACE_ENCRYPTION_KEY
        generateValue: true
      - key: FACE_MATCH_THRESHOLD
        value: 0.50
      - key: FACE_PRESENCE_DURATION
        value: 30
      - key: LOG_LEVEL
        value: WARNING
    healthCheckPath: /
    autoDeploy: true
    dockerCommand: "sh -c 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 10000 school_project.asgi:application'"
    numInstances: 1

  # Camera Service
  - type: web
    name: edumi2-camera
    runtime: docker
    plan: free
    dockerfilePath: ./camera_service/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edumi2-db
          property: connectionString
      - key: DEBUG
        value: false
    autoDeploy: true
    dockerCommand: "python manage.py runserver 0.0.0.0:10000"
    numInstances: 1

  # Redis Service
  - type: redis
    name: edumi2-redis
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections

databases:
  # PostgreSQL Database
  - name: edumi2-db
    databaseName: edumi2
    user: edumi2
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections
